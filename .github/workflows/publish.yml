name: Publish to npm (tags)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn
          registry-url: https://registry.npmjs.org

      # Tag and package versions must agree before any install/build/publish.
      - name: Validate release tag and classify dist-tag
        shell: bash
        run: node .github/scripts/release-metadata.cjs validate "${GITHUB_REF#refs/tags/}" package.json

      - name: Install dependencies
        run: |
          corepack enable
          yarn --version
          yarn install --frozen-lockfile

      - name: Read package metadata and publish plan
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SHOULD_PUBLISH="true"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            SHOULD_PUBLISH="false"
          fi

          echo "Detected tag: $GITHUB_REF_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $PACKAGE_VERSION"
          echo "Publish tag: $PUBLISH_TAG"
          echo "Should publish: $SHOULD_PUBLISH"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Run build
        if: steps.metadata.outputs.should_publish == 'true'
        run: yarn build

      - name: Publish package
        if: steps.metadata.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag "${{ steps.metadata.outputs.publish_tag }}" --access public

      - name: Skip duplicate publish
        if: steps.metadata.outputs.should_publish != 'true'
        run: |
          echo "Version ${{ steps.metadata.outputs.package_version }} already exists on npm."
          echo "Skipping publish for ${{ steps.metadata.outputs.package_name }}."
